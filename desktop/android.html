<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Android · SpicySwipe</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="android.css"></head>
<body class="android-popout">
<header class="popout-header"><div><strong id="device-title">Android</strong><small id="device-label">Connecting…</small></div><button id="dock-device">Return to workspace</button></header>
<main class="phone-stage"><span id="connecting">Connecting to your device…</span><img id="phone-screen" alt="Android screen. Click a field to tap and type." draggable="false" hidden><textarea id="phone-keyboard" class="android-keyboard" aria-label="Android keyboard input" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></main>
<footer><div class="device-controls"><button id="back">← Back</button><button id="scroll-down">Scroll ↓</button><button id="scroll-up">Scroll ↑</button><button id="store">Play Store</button><button id="open-app">Open app</button></div><p id="preview-status" role="status">Click the screen to use your keyboard. Paste works; Enter acts on the device.</p><small>Plain keyboard characters supported. Use the Android keyboard for Unicode or emoji.</small></footer>
<div id="notice" role="status" hidden></div>
<script src="android-controls.js"></script><script src="android-renderer.js"></script></body></html>
