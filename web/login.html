<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7ef">
  <title>Sign in · SpicySwipe</title>
  <link rel="stylesheet" href="/web/login.css">
  <script src="/web/login.js" defer></script>
</head>
<body>
  <main class="spread">
    <section class="entry" aria-labelledby="welcome">
      <header class="masthead">
        <span class="brand">
          <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="currentColor"/><path d="m23 6-14 17h10l-2 11 15-20H21l2-8Z" fill="#fff7e8"/></svg>
          Spicy<span>Swipe</span>
        </span>
      </header>

      <div class="form-wrap">
        <p class="eyebrow"><span class="rule"></span>Workspace access</p>
        <h1 id="welcome">Welcome<br><em>back.</em></h1>
        <p class="intro">Sign in to your private workspace.</p>
        <form action="/api/login" method="post" id="signin">
          <label for="password">Workspace password</label>
          <div class="field">
            <svg class="lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg>
            <input id="password" name="password" type="password" placeholder="Enter your password" required autocomplete="current-password" aria-describedby="feedback">
            <button type="button" id="reveal" class="visibility" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M3 3l18 18"/></svg>
            </button>
          </div>
          <p id="feedback" class="feedback" role="alert"></p>
          <button type="submit" id="submit" class="submit"><span>Sign in</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
          <noscript><p>Enable JavaScript to sign in to your workspace.</p></noscript>
        </form>
      </div>
      <footer class="entry-foot"><span class="dot"></span>Private workspace</footer>
    </section>

    <figure class="plate" aria-label="The Matchbook, a SpicySwipe illustration">
      <div class="plate-top"><span>SpicySwipe studio</span><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 1v26M1 14h26m-22-9 18 18M5 23 23 5"/></svg></div>
      <svg class="art" viewBox="0 0 620 540" role="presentation" aria-hidden="true">
        <defs>
          <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#f1baa2" opacity=".21"/></pattern>
          <pattern id="striker" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#602c37"/><path d="m0 0 9 9m-9 0 9-9" stroke="#e29c7d" stroke-width="1"/></pattern>
          <pattern id="lines" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 1h5" stroke="#9c634d" stroke-width="1.6"/></pattern>
          <radialGradient id="halo"><stop stop-color="#fc926d" stop-opacity=".19"/><stop offset="1" stop-color="#fc926d" stop-opacity="0"/></radialGradient>
          <linearGradient id="cover" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#ff9c77"/><stop offset=".6" stop-color="#f58364"/><stop offset="1" stop-color="#e36b56"/></linearGradient>
          <linearGradient id="wood"><stop stop-color="#f3d4a4"/><stop offset="1" stop-color="#c38869"/></linearGradient>
          <g id="spark" fill="currentColor"><path d="M0-17C2-5 4-2 16 0 4 2 2 5 0 17-2 5-4 2-16 0-4-2-2-5 0-17Z"/></g>
        </defs>
        <rect x="18" y="38" width="584" height="465" fill="url(#grid)"/>
        <ellipse cx="390" cy="255" rx="235" ry="218" fill="url(#halo)"/>
        <g fill="none" stroke="#eaa68e" opacity=".24" transform="rotate(-21 310 290)">
          <ellipse cx="310" cy="290" rx="272" ry="130" stroke-dasharray="3 6"/>
          <ellipse cx="310" cy="290" rx="251" ry="110" stroke-width=".7"/>
        </g>
        <!-- Letterpress matchbox sleeve and its crosshatched striker. -->
        <g transform="translate(109 132) rotate(-16 145 155)">
          <path d="m7 24 286-7 16 24-5 294-281 12-23-27Z" fill="#140f17" opacity=".3" transform="translate(9 13)"/>
          <path d="m8 15 280-9 18 18-3 295-282 11-17-18Z" fill="#e9bd92" stroke="#431f2a" stroke-width="3"/>
          <path d="m9 18 278-10 15 19-281 11Z" fill="url(#lines)"/>
          <path d="m282 14 21 15-3 286-21-15Z" fill="url(#striker)" stroke="#642e38" stroke-width="3"/>
          <rect x="0" y="0" width="282" height="305" rx="4" fill="url(#cover)" stroke="#542b33" stroke-width="3"/>
          <g fill="none" stroke="#58313a"><rect x="12" y="12" width="258" height="281" rx="2" stroke-width="1.7"/><path d="M20 49h242m-242 203h242" stroke-width="1"/></g>
          <g fill="#562c36" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700">
            <text x="141" y="35" font-size="9" letter-spacing="3">SPICYSWIPE MATCH CO.</text>
            <text x="141" y="278" font-size="9" letter-spacing="3">STRIKE ANYWHERE</text>
          </g>
          <g transform="translate(141 115)" fill="none">
            <circle r="45" stroke="#733c40" stroke-width="1.3" stroke-dasharray="1 6"/>
            <circle r="36" stroke="#753c40" stroke-width=".8"/>
            <path d="m12-34-35 41H1l-8 30L28-11H7l5-23Z" fill="#fff0cb" stroke="#593039" stroke-width="2.5" stroke-linejoin="round"/>
          </g>
          <g fill="#542a33" font-family="Georgia,serif" font-style="italic" font-weight="700" text-anchor="middle">
            <text x="139" y="200" font-size="57" letter-spacing="-4">Spicy</text><text x="140" y="240" font-size="57" letter-spacing="-4">Swipe</text>
          </g>
          <g color="#632e38"><use href="#spark" transform="translate(48 107) scale(.48)"/><use href="#spark" transform="translate(235 115) scale(.45)"/></g>
        </g>
        <!-- A single lit match, offset from the sleeve. -->
        <g transform="translate(454 200) rotate(26)">
          <path d="M-6 9h13v234l-6 5-7-5Z" fill="url(#wood)" stroke="#4a2b31" stroke-width="2"/>
          <path d="M1 25v214" fill="none" stroke="#98634d" stroke-width="1.2"/>
          <path d="M-1-87c7 29 29 36 27 62-1 18-13 27-26 27-18 0-29-10-28-29 0-15 13-24 12-41 6 3 8 8 8 12 9-11 9-21 7-31Z" fill="#f68b64"/>
          <path d="M4-50c-3 17 13 23 12 34-1 11-8 17-17 17-11-1-18-7-16-18 2-11 13-16 12-26 3 3 4 6 5 8 3-5 4-10 4-15Z" fill="#ffd294"/>
          <path d="M4-26c-1 10 6 11 6 19 0 6-5 10-10 9-6 0-8-5-7-10 2-7 9-10 11-18Z" fill="#fff1ce"/>
          <ellipse cy="6" rx="8" ry="11" fill="#623543"/>
        </g>
        <g color="#f0bd96"><use href="#spark" transform="translate(430 85) scale(.56)"/><use href="#spark" transform="translate(500 157) scale(.32)"/><use href="#spark" transform="translate(98 385) scale(.53)"/></g>
      </svg>
      <figcaption><span>The Matchbook</span><span class="plate-no">Plate Nº 01</span></figcaption>
    </figure>
  </main>
</body>
</html>
