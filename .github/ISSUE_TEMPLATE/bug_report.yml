name: Bug report
description: Report a reproducible SpicySwipe problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Remove names, profile photos, messages, credentials, and account identifiers. Report security vulnerabilities privately using SECURITY.md."
  - type: input
    id: version
    attributes:
      label: SpicySwipe version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      placeholder: Windows 11 x64, macOS ARM64, etc.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected integration
      options:
        - Tinder desktop
        - Hinge Android
        - Bumble Android
        - Chrome extension
        - AI provider
        - Setup or other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android version, emulator/device model, and dating-app version (if applicable)
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior, and actual behavior
      description: Include the exact error and a minimal reproduction using sample data.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal information, account data, and credentials from this report.
          required: true
