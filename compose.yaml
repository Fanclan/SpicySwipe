services:
  spicyswipe:
    build: .
    init: true
    restart: unless-stopped
    shm_size: 512m
    security_opt:
      - seccomp=./web/chromium-seccomp.json
    environment:
      SPICYSWIPE_PASSWORD: ${SPICYSWIPE_PASSWORD:?Set a strong password in .env}
      SPICYSWIPE_STORAGE_KEY: ${SPICYSWIPE_STORAGE_KEY:?Set a persistent 32-byte hex key in .env}
    ports:
      - "127.0.0.1:${SPICYSWIPE_PORT:-8187}:8080"
      - "${SPICYSWIPE_LAN_IP:?Set the server LAN address}:${SPICYSWIPE_PORT:-8187}:8080"
    volumes:
      - workspace:/data
volumes:
  workspace:
    external: true
    name: spicyswipe_workspace
